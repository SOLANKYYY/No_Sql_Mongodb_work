name: exercise10-transactions
x-mongo: &mongo
  image: mongo:7.0
  command: [mongod, --replSet, ex10, --bind_ip_all, --wiredTigerCacheSizeGB, '0.25']
  networks: [lab]
services:
  ex10-mongo1:
    <<: *mongo
    container_name: ex10-mongo1
    volumes: [mongo1:/data/db]
  ex10-mongo2:
    <<: *mongo
    container_name: ex10-mongo2
    volumes: [mongo2:/data/db]
  ex10-mongo3:
    <<: *mongo
    container_name: ex10-mongo3
    volumes: [mongo3:/data/db]
  python:
    profiles: [tools]
    build: .
    image: ${EX10_IMAGE:-exercise10-transactions:local}
    networks: [lab]
    volumes: [./results:/results]
    environment:
      RESULTS_DIR: /results
networks:
  lab:
    name: exercise10-transactions-net
volumes:
  mongo1:
  mongo2:
  mongo3:
